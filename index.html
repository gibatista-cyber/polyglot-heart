<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polyglot Heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="script.js">
</head>
<body>
<section class="terminal" id="terminal" aria-label="Mensagem criptografada">
  <p class="term-line" id="l1"></p>
  <p class="term-line" id="l2"></p>
  <p class="term-line" id="l3"></p>
  <button class="decrypt" id="decrypt" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span id="decrypt-label">Decifrar mensagem</span>
  </button>
</section>

<header>
  <p class="status">[ mensagem <b>decifrada</b> ] · ♥</p>
  <h1>Feliz aniversário</h1>
</header>

<div class="stage" id="stage">
  <canvas id="heart" role="img" aria-label="Um coração feito de 'eu te amo' escrito em dezenas de idiomas"></canvas>
</div>

<footer>
  <p class="lang" id="lang" aria-live="off">&nbsp;</p>
  <p class="name"><span class="nick">Para você</span></p>
  <p class="vow">Te amo em todas as línguas</p>
</footer>

<script src="script.js"></script>
</body>
</html>
